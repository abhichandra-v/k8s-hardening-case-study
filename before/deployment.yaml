# ❌ THE "BEFORE" — a deployment riddled with the misconfigurations that show up
# in almost every un-reviewed cluster. Kept on purpose as the scan baseline.
#
# Everything wrong here is common, not contrived:
#   - runs as root, privileged, privilege escalation allowed
#   - writable root filesystem, all capabilities retained
#   - :latest image tag (you can't tell what's running or roll back cleanly)
#   - no resource requests/limits (one pod can starve the node)
#   - no liveness/readiness probes (k8s can't tell if it's healthy)
#   - secrets passed as plaintext env vars
#   - hostPath mount of the Docker socket — a classic container-escape path
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-api
  labels:
    app: payments-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payments-api
  template:
    metadata:
      labels:
        app: payments-api
    spec:
      containers:
        - name: payments-api
          image: payments-api:latest
          ports:
            - containerPort: 8080
          env:
            - name: DB_PASSWORD
              value: "sup3rs3cr3t-plaintext"   # secret in plain env
            - name: STRIPE_KEY
              value: "sk_live_hardcoded_key"
          securityContext:
            privileged: true
            runAsUser: 0
            allowPrivilegeEscalation: true
            readOnlyRootFilesystem: false
          volumeMounts:
            - name: docker-sock
              mountPath: /var/run/docker.sock
      volumes:
        - name: docker-sock
          hostPath:
            path: /var/run/docker.sock
